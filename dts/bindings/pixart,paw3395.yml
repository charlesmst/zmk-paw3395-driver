description: |
  Sensor driver for the pixart PAW3395 mouse sensor 

compatible: "pixart,paw3395"

include: spi-device.yaml

properties:
  irq-gpios:
    type: phandle-array
    required: true
  cpi:
    type: int
    default: 600
    description: "CPI value (Range: 50 - 26000, Step: 50)"
  swap-xy:
    type: boolean
  invert-x:
    type: boolean
  invert-y:
    type: boolean
  evt-type:
    type: int
    required: true
  x-input-code:
    type: int
    required: true
  y-input-code:
    type: int
    required: true
  power-mode:
    type: int
    default: 0
    description: |
      Power mode
      0: High power
      1: Low power
      2: Office
  force-awake:
    type: boolean
  init-retry-count:
    type: int
    default: 5
    description: "Number of retries for initialization"
  init-retry-interval:
    type: int
    default: 100
    description: "Interval between initialization retries in ms"
  usb-rate-ms:
    type: int
    description: |
      Report-interval (ms) used as the boot default.
      1 = 1000 Hz, 4 = 250 Hz, 8 = 120 Hz.
  ble-rate-ms:
    type: int
    description: |
      Optional BLE report-interval hint for configs that use out-of-tree transport switching.
      1 = 1000 Hz, 4 = 250 Hz, 8 = 120 Hz.
  rate-cycle-gpios:
    type: phandle-array
    description: |
      Optional GPIO for a hardware rate-cycle button (e.g. DPI button).
      On each falling edge the report interval advances through
      rate-cycle-rates-ms and wraps around. Entirely local to the
      peripheral — no central/keymap involvement.
  rate-cycle-rates-ms:
    type: array
    description: |
      Ordered list of report-interval values (ms) to cycle through when
      rate-cycle-gpios is pressed. 0 = no limit. Defaults to 8 4 1
      (120 Hz → 250 Hz → 1000 Hz) if not specified.
